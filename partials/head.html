<!-- langue mémorisée appliquée avant l'affichage (src/i18n) : la page reste masquée le temps de la traduire, 1,5 s au plus -->
<script>try{if(localStorage.getItem('monkey-events-lang')==='en'){var d=document.documentElement;d.lang='en';d.classList.add('i18n-pending');setTimeout(function(){d.classList.remove('i18n-pending')},1500)}}catch(e){}</script>
<style>.i18n-pending body{visibility:hidden}</style>
